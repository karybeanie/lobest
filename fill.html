<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>填生日 · 老best生日</title>
<meta name="description" content="幫老best填你嘅生日，佢會喺你生日12點正第一個同你講生日快樂。">
<style>
  :root {
    --berry: #EE4D6E; --tangerine: #FF9A5A; --plum: #A8235F;
    --bg: #FFF6EE; --card: #FFFFFF; --ink: #2B1A23; --subtle: #8A6F7B; --line: #F1E2E6;
    --field: #FFF9F5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1A1116; --card: #261A21; --ink: #F6E9EE; --subtle: #B59AA6; --line: #3A2A33; --field: #2F2129; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang HK", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 16px 40px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .hero {
    margin: 16px 0 18px; padding: 26px 22px 24px; border-radius: 28px; color: #fff;
    background: linear-gradient(135deg, var(--tangerine), var(--berry) 55%, var(--plum));
    box-shadow: 0 12px 30px rgba(238,77,110,.3); position: relative; overflow: hidden;
  }
  .hero::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,.12); right: -60px; top: -70px; }
  .cake { font-size: 46px; line-height: 1; }
  h1 { font-size: 26px; margin: 12px 0 8px; font-weight: 800; line-height: 1.25; }
  .hero p { margin: 0; font-size: 15px; line-height: 1.55; opacity: .95; }
  .card { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 14px; }
  label.t { display: block; font-size: 14px; font-weight: 700; color: var(--subtle); margin: 0 0 8px; }
  .field + label.t { margin-top: 18px; }
  input[type=text], input[type=tel], select {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none; -webkit-appearance: none; appearance: none;
  }
  input[type=text]:focus, input[type=tel]:focus, select:focus { border-color: var(--berry); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .seg { display: flex; background: var(--field); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; }
  .seg button { flex: 1; font: inherit; font-size: 16px; font-weight: 700; border: 0; border-radius: 10px; padding: 9px 0;
    background: transparent; color: var(--subtle); }
  .seg button.on { background: linear-gradient(135deg, var(--tangerine), var(--berry)); color: #fff; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 16px; }
  .check input { width: 22px; height: 22px; accent-color: var(--berry); }
  .hint { font-size: 13px; color: var(--subtle); margin-top: 8px; line-height: 1.5; }
  .err { color: var(--berry); font-size: 14px; font-weight: 700; margin-top: 10px; min-height: 1em; }
  .btn { display: block; width: 100%; text-align: center; font: inherit; font-size: 18px; font-weight: 800;
    border: 0; border-radius: 999px; padding: 16px; margin-top: 6px; color: #fff; text-decoration: none;
    background: #25B865; box-shadow: 0 8px 20px rgba(37,184,101,.3); }
  .btn.alt { background: var(--card); color: var(--berry); box-shadow: none; border: 1.5px solid var(--line); font-size: 16px; padding: 13px; margin-top: 10px; }
  .foot { text-align: center; font-size: 12px; color: var(--subtle); margin-top: 18px; line-height: 1.6; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="cake">🎂</div>
    <h1 id="title">你嘅老best想記住你生日</h1>
    <p id="sub">填完撳最底個掣，用WhatsApp send返俾佢，佢就會喺你生日12點正第一個同你講生日快樂！</p>
  </div>

  <div class="card">
    <label class="t" for="name">你個名（佢平時點叫你）</label>
    <input type="text" id="name" maxlength="20" placeholder="例如：阿明" autocomplete="nickname">

    <div class="field"></div>
    <label class="t">你過邊個生日</label>
    <div class="seg" role="radiogroup">
      <button type="button" id="solar" class="on" aria-pressed="true">西曆</button>
      <button type="button" id="lunar" aria-pressed="false">農曆</button>
    </div>

    <div class="field"></div>
    <label class="t">幾時生日</label>
    <div class="row">
      <select id="month" aria-label="月"></select>
      <select id="day" aria-label="日"></select>
    </div>

    <label class="check"><input type="checkbox" id="knowsYear"> 講埋出世年份（佢會知你幾多歲）</label>
    <div id="yearBox" style="display:none; margin-top:10px">
      <select id="year" aria-label="出世年份"></select>
    </div>

    <div class="field"></div>
    <label class="t" for="phone">你嘅WhatsApp電話（選填）</label>
    <input type="tel" id="phone" maxlength="20" placeholder="例如：9123 4567" autocomplete="tel" inputmode="tel">
    <div class="hint">填咗佢一撳就可以WhatsApp你講生日快樂；唔想俾就留空。住外國已經幫你入咗國碼，唔啱可以改。</div>

    <div class="hint" id="tzHint"></div>
    <div class="err" id="err"></div>
  </div>

  <button class="btn" id="send" type="button">📲 用WhatsApp send返俾佢</button>
  <button class="btn alt" id="copy" type="button">複製成段（用其他app send）</button>

  <div class="foot">
    資料唔會上傳去任何伺服器，只會經你自己send俾你朋友。<br>
    由「老best生日」app整 🎂
  </div>
</div>
<div class="toast" id="toast">複製咗！</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var from = (params.get('from') || '').trim().slice(0, 20);
  var who = from || '你嘅老best';
  document.getElementById('title').textContent = who + ' 想記住你生日';
  document.getElementById('sub').textContent = '填完撳最底個掣，用WhatsApp send返俾' + (from || '佢') + '，佢就會喺你生日12點正第一個同你講生日快樂！';
  document.getElementById('send').textContent = '📲 用WhatsApp send返俾' + (from || '佢');

  var lunarMonths = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var nums = ['','一','二','三','四','五','六','七','八','九','十'];
  function lunarDay(d) {
    if (d <= 10) return '初' + nums[d];
    if (d < 20) return '十' + nums[d - 10];
    if (d === 20) return '二十';
    if (d < 30) return '廿' + nums[d - 20];
    return '三十';
  }
  var isLunar = false;
  var monthSel = document.getElementById('month');
  var daySel = document.getElementById('day');
  var yearSel = document.getElementById('year');

  function fillMonths() {
    var keep = monthSel.value || '1';
    monthSel.innerHTML = '';
    for (var m = 1; m <= 12; m++) {
      var o = document.createElement('option');
      o.value = m; o.textContent = isLunar ? lunarMonths[m - 1] : (m + '月');
      monthSel.appendChild(o);
    }
    monthSel.value = keep;
  }
  function maxDay() {
    if (isLunar) return 30;
    return [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][monthSel.value - 1];
  }
  function fillDays() {
    var keep = parseInt(daySel.value || '1', 10);
    var max = maxDay();
    daySel.innerHTML = '';
    for (var d = 1; d <= max; d++) {
      var o = document.createElement('option');
      o.value = d; o.textContent = isLunar ? lunarDay(d) : (d + '日');
      daySel.appendChild(o);
    }
    daySel.value = Math.min(keep, max);
  }
  var thisYear = new Date().getFullYear();
  for (var y = thisYear; y >= thisYear - 100; y--) {
    var o = document.createElement('option'); o.value = y; o.textContent = y + '年'; yearSel.appendChild(o);
  }
  yearSel.value = thisYear - 30;

  fillMonths(); fillDays();
  monthSel.addEventListener('change', fillDays);
  function setCal(lunar) {
    isLunar = lunar;
    document.getElementById('solar').classList.toggle('on', !lunar);
    document.getElementById('lunar').classList.toggle('on', lunar);
    document.getElementById('solar').setAttribute('aria-pressed', String(!lunar));
    document.getElementById('lunar').setAttribute('aria-pressed', String(lunar));
    fillMonths(); fillDays();
  }
  document.getElementById('solar').addEventListener('click', function () { setCal(false); });
  document.getElementById('lunar').addEventListener('click', function () { setCal(true); });
  document.getElementById('knowsYear').addEventListener('change', function (e) {
    document.getElementById('yearBox').style.display = e.target.checked ? 'block' : 'none';
  });

  // 朋友部電話嘅時區：等佢喺外國都可以跟佢嗰邊12點
  var tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  // 住外國：電話格預設幫佢入咗國碼（香港8個數字app會自己加+852）
  var codes = {
    'Asia/Macau':'853','Asia/Taipei':'886','Asia/Shanghai':'86','Asia/Tokyo':'81','Asia/Seoul':'82',
    'Asia/Singapore':'65','Asia/Kuala_Lumpur':'60','Asia/Bangkok':'66','Asia/Manila':'63',
    'Asia/Ho_Chi_Minh':'84','Asia/Kolkata':'91','Asia/Jakarta':'62','Asia/Dubai':'971',
    'Europe/London':'44','Europe/Dublin':'353','Europe/Paris':'33','Europe/Berlin':'49',
    'Europe/Amsterdam':'31','Europe/Brussels':'32','Europe/Zurich':'41','Europe/Rome':'39',
    'Europe/Madrid':'34','Europe/Stockholm':'46','Europe/Oslo':'47','Europe/Copenhagen':'45',
    'Europe/Vienna':'43','Pacific/Auckland':'64','Pacific/Honolulu':'1'
  };
  var code = codes[tz] || (/^Australia\//.test(tz) ? '61' : '') ||
    (/^America\/(New_York|Chicago|Denver|Phoenix|Los_Angeles|Anchorage|Detroit|Toronto|Vancouver|Edmonton|Winnipeg|Halifax|Regina|St_Johns)$/.test(tz) ? '1' : '');
  var phoneBox = document.getElementById('phone');
  var prefix = code ? '+' + code + ' ' : '';
  if (prefix && !phoneBox.value) phoneBox.value = prefix;

  if (tz) {
    document.getElementById('tzHint').textContent = '🌏 會一齊send埋你而家嘅地區（' + tz.replace(/_/g, ' ') + '），等佢跟你嗰邊12點同你講。';
  }

  function build() {
    var name = document.getElementById('name').value.trim();
    var err = document.getElementById('err');
    if (!name) { err.textContent = '要填返你個名呀'; document.getElementById('name').focus(); return null; }
    err.textContent = '';
    var m = parseInt(monthSel.value, 10), d = parseInt(daySel.value, 10);
    var withYear = document.getElementById('knowsYear').checked;
    var q = 'name=' + encodeURIComponent(name) + '&cal=' + (isLunar ? 'lunar' : 'solar') + '&m=' + m + '&d=' + d;
    if (withYear) q += '&y=' + yearSel.value;
    if (tz) q += '&tz=' + encodeURIComponent(tz);
    // 電話：淨係留數字、+ 同空格；8至15個數字先當有填
    var phone = document.getElementById('phone').value.replace(/[^0-9+ ]/g, '').trim().slice(0, 20);
    var phoneDigits = phone.replace(/[^0-9]/g, '').length;
    // 淨係得預設國碼（冇再打電話）：當冇填
    if (phone.charAt(0) === '+' && phoneDigits <= 4) { phone = ''; phoneDigits = 0; }
    if (phone && (phoneDigits < 8 || phoneDigits > 15)) {
      err.textContent = '電話好似唔啱，檢查吓或者留空';
      document.getElementById('phone').focus();
      return null;
    }
    if (phone) q += '&p=' + encodeURIComponent(phone);
    var link = 'lobestbirthday://add?' + q;
    var dateText = isLunar ? ('農曆' + lunarMonths[m - 1] + lunarDay(d)) : (m + '月' + d + '日');
    if (withYear) dateText = yearSel.value + '年' + dateText;
    return '我係' + name + '，我生日係' + dateText + '🎂\n' +
           '用「老best生日」app撳呢條link，就會自動加埋我：\n' + link + '\n' +
           '（撳唔到嘅話：copy成段message，再喺app「老best」分頁左上角「⋯」揀「貼上生日link」）';
  }

  document.getElementById('send').addEventListener('click', function () {
    var text = build(); if (!text) return;
    location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  });
  document.getElementById('copy').addEventListener('click', function () {
    var text = build(); if (!text) return;
    var done = function () {
      var t = document.getElementById('toast'); t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('複製呢段：', text); });
    } else { window.prompt('複製呢段：', text); }
  });
})();
</script>
</body>
</html>
